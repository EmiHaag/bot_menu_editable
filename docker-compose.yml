services:
  bot-menu:
    build: .
    container_name: bot-menu-whatsapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - auth_baileys:/app/auth_info_baileys
      - auth_cliente_ncr:/app/auth_info_cliente_ncr
      - ./.env:/app/.env:ro
    env_file:
      - .env

volumes:
  auth_baileys:
  auth_cliente_ncr:
